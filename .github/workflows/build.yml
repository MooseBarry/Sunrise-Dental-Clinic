name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests
        run: mvn test

      - name: Build WAR package
        run: mvn package -DskipTests

      - name: Confirm build success
        run: echo "BUILD SUCCESS - sunrise-dental-clinic packaged"

      - name: Upload WAR file
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic
          path: target/*.war