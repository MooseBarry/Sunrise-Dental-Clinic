name: Maven CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests and build WAR
        run: mvn --batch-mode clean verify

      - name: Upload deployable WAR
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target/sunrise-dental-clinic.war
          if-no-files-found: error
          retention-days: 14